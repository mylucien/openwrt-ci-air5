name: Build U-Boot Air5 (IPQ8072A SPI-NOR)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libncurses-dev \
            device-tree-compiler u-boot-tools \
            bc bison flex python2.7 git wget

      # 克隆与 build.sh 完全一致的工具链
      - name: Clone toolchain
        run: |
          git clone --depth=1 \
            https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git \
            ../staging_dir
          echo "Toolchain cloned"
          ls ../staging_dir/toolchain-arm_cortex-a7_gcc-5.2.0_musl-1.1.16_eabi/bin/ | grep gcc

      # 克隆 u-boot-2016 源码
      - name: Clone u-boot-2016
        run: |
          git clone --depth=1 \
            https://github.com/1980490718/u-boot-2016.git \
            uboot
          echo "u-boot cloned @ $(cd uboot && git rev-parse --short HEAD)"

      # 将本仓库的 Air5 文件覆盖到 uboot 源码树
      - name: Overlay Air5 files
        run: |
          set -e

          # 1. 新增 cmd_bootspinor.c
          cp -v air5/cmd_bootspinor.c \
                uboot/common/cmd_bootspinor.c

          # 2. 追加 cmd_bootspinor 到 common/Makefile
          if ! grep -q "cmd_bootspinor" uboot/common/Makefile; then
            echo 'obj-$(CONFIG_CMD_BOOTSPINOR) += cmd_bootspinor.o' \
              >> uboot/common/Makefile
            echo "Appended cmd_bootspinor.o to common/Makefile"
          fi

          # 3. 覆盖 include/configs/ipq807x.h（修改 bootcmd + env）
          cp -v air5/ipq807x.h \
                uboot/include/configs/ipq807x.h

          # 4. 添加 air5_defconfig
          cp -v air5/air5_defconfig \
                uboot/configs/air5_defconfig

          echo "Overlay complete"
          echo "--- configs/air5_defconfig ---"
          cat uboot/configs/air5_defconfig
          echo ""
          echo "--- common/Makefile tail ---"
          tail -5 uboot/common/Makefile

      # 设置工具链环境变量
      - name: Set toolchain env
        run: |
          TOOLCHAIN="${{ github.workspace }}/../staging_dir/toolchain-arm_cortex-a7_gcc-5.2.0_musl-1.1.16_eabi/bin"
          echo "TOOLCHAIN=${TOOLCHAIN}" >> $GITHUB_ENV
          echo "PATH=${TOOLCHAIN}:$PATH" >> $GITHUB_ENV
          echo "ARCH=arm" >> $GITHUB_ENV
          echo "CROSS_COMPILE=arm-openwrt-linux-" >> $GITHUB_ENV
          echo "STAGING_DIR=${{ github.workspace }}/../staging_dir/" >> $GITHUB_ENV
          # verify toolchain
          ls -la "${TOOLCHAIN}/arm-openwrt-linux-gcc" || {
            echo "TOOLCHAIN not found at ${TOOLCHAIN}"
            find ${{ github.workspace }}/../staging_dir -name "arm-openwrt-linux-gcc" 2>/dev/null || echo "No toolchain gcc found!"
            exit 1
          }

      - name: Configure
        run: |
          cd uboot
          make \
            ARCH=arm \
            CROSS_COMPILE=arm-openwrt-linux- \
            air5_defconfig

          echo "=== Key config items ==="
          grep -E "CONFIG_(BOOTCOMMAND|BOOTDELAY|CMD_BOOTSPINOR|ENV_IS_IN|SPI_FLASH|NAND|SYS_TEXT_BASE)" \
            .config | sort

      - name: Build
        run: |
          cd uboot
          make \
            ARCH=arm \
            CROSS_COMPILE=arm-openwrt-linux- \
            HOSTLDFLAGS="-L${STAGING_DIR}usr/lib -znow -zrelro -pie" \
            -j$(nproc) all 2>&1 | tee ../build.log
          test -f u-boot

      # 与 build.sh 完全一致: strip → elftombn.py -v 3
      - name: Package (strip + elftombn MBN v3)
        run: |
          cd uboot
          mkdir -p bin

          arm-openwrt-linux-strip u-boot -o u-boot.strip

          python2.7 tools/elftombn.py \
            -f ./u-boot.strip \
            -o bin/openwrt-air5-u-boot.mbn \
            -v 3

          # 清理中间文件（与 build.sh 一致）
          rm -f bin/openwrt-air5-u-boot_combined_hash.mbn \
                bin/openwrt-air5-u-boot.hash \
                bin/openwrt-air5-u-boot_hash.hd \
                bin/openwrt-air5-u-boot_phdr.pbn
          rm -f u-boot.strip

          ls -lh bin/
          echo ""
          echo "=== MBN header (first 32 bytes) ==="
          xxd bin/openwrt-air5-u-boot.mbn | head -4

      - name: Verify
        run: |
          cd uboot
          echo "=== u-boot ELF entry point ==="
          arm-openwrt-linux-readelf -h u-boot | grep "Entry point"

          echo "=== bootspinor symbol in u-boot ==="
          arm-openwrt-linux-nm u-boot | grep bootspinor || \
            echo "WARNING: bootspinor not found in symbol table"

          echo "=== MBN file size ==="
          stat -c "Size: %s bytes" bin/openwrt-air5-u-boot.mbn
          SIZE=$(stat -c%s bin/openwrt-air5-u-boot.mbn)
          LIMIT=$((640*1024))
          [ "$SIZE" -le "$LIMIT" ] \
            && echo "OK: fits in APPSBL (${SIZE}B / ${LIMIT}B limit)" \
            || echo "WARNING: exceeds APPSBL 640KB limit!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uboot-air5-${{ github.run_number }}
          path: |
            uboot/bin/openwrt-air5-u-boot.mbn
            build.log
          retention-days: 60

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: uboot/bin/openwrt-air5-u-boot.mbn
          body: |
            ## U-Boot Air5 ${{ github.ref_name }}
            - SoC: IPQ8072A  
            - Flash: W25R512NWEIQ 64MB 1.8V SPI-NOR  
            - bootcmd: `bootspinor`  
            - 格式: MBN v3（高通签名格式）  
            - 烧写偏移: APPSBL `0x200000`  
